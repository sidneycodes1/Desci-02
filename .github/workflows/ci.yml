name: SciAgent Protocol CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  typecheck-and-test:
    name: Monorepo Typecheck & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.32.1

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Workspace Typecheck
        run: pnpm typecheck

      - name: Run Workspace Lint
        run: pnpm lint

      - name: Run Workspace Unit & Integration Tests
        shell: bash
        run: set -o pipefail && pnpm test 2>&1 | tee test.log

      - name: Run Workspace Production Build
        if: always()
        shell: bash
        run: set -o pipefail && pnpm build 2>&1 | tee build.log

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ github.run_id }}
          path: |
            test.log
            build.log
          if-no-files-found: warn

  foundry-tests:
    name: Smart Contract Foundry Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run Forge Tests
        run: |
          cd packages/contracts
          forge test --vv
