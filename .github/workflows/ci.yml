name: SciAgent Protocol CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  typecheck-and-test:
    name: Monorepo Typecheck & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.32.1

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Workspace Typecheck
        run: pnpm typecheck

      - name: Run Workspace Lint
        run: pnpm lint

      - name: Run Workspace Unit & Integration Tests
        run: pnpm test

      - name: Run Workspace Production Build
        if: always()
        run: pnpm build

  foundry-tests:
    name: Smart Contract Foundry Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run Forge Tests
        run: |
          cd packages/contracts
          forge test --vv
